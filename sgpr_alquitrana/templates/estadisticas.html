{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="fw-bold mb-1">Estadísticas de Solicitudes</h3>
    <p class="text-muted mb-0">Generar gráficos y reportes por rango de fechas y por trabajador.</p>
  </div>
  <div class="d-flex gap-2">
    <button id="export-pdf-btn" type="button" class="btn btn-outline-secondary btn-export">
      <i class="fa-solid fa-file-pdf me-2"></i>Descargar PDF
    </button>
  </div>
</div>

<form id="stats-form" method="get" class="mb-4 row gx-2 gy-2 align-items-end">
  <div class="col-md-2">
    <label class="visually-hidden" for="fecha_inicio">Fecha inicio</label>
    <input type="date" id="fecha_inicio" name="fecha_inicio" class="form-control" value="{{ request.GET.fecha_inicio|default:'' }}">
  </div>
  <div class="col-md-2">
    <label class="visually-hidden" for="fecha_fin">Fecha fin</label>
    <input type="date" id="fecha_fin" name="fecha_fin" class="form-control" value="{{ request.GET.fecha_fin|default:'' }}">
  </div>
  <div class="col-md-3">
    <label class="visually-hidden" for="cedula">Cédula</label>
    <input type="text" id="cedula" name="q" placeholder="Cédula (opcional)" class="form-control" value="{{ request.GET.q|default:'' }}">
    <input type="hidden" id="trabajador_id" name="trabajador_id" value="{{ request.GET.trabajador_id|default:'' }}">
  </div>
  <div class="col-md-3 position-relative">
    <label class="visually-hidden" for="nombre">Nombre/Apellidos</label>
    <input type="text" id="nombre" placeholder="Buscar por nombre o apellidos" class="form-control" value="">
    <div id="worker-search-results" class="list-group position-absolute" style="z-index:2000; max-height:240px; overflow:auto; display:none; width:100%;"></div>
  </div>
  <div class="col-md-1">
    <label class="visually-hidden" for="ubicacion">Ubicación Administrativa</label>
    <input type="text" id="ubicacion" name="ubicacion" placeholder="Ubicación administrativa (opcional)" class="form-control" value="{{ request.GET.ubicacion|default:'' }}">
  </div>
  <div class="col-md-1 d-grid">
    <button type="submit" class="btn btn-secondary">Aplicar</button>
  </div>
</form>

<style>
  .stats-row { display:flex; gap:12px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
  .stats-canvas { flex: 1 1 40%; max-width: 45%; min-width:220px; }
  .stats-canvas canvas { width:100% !important; max-height:220px !important; height:auto !important; }
</style>

<div class="stats-row mb-4">
  <div class="stats-canvas">
    <canvas id="statsChart" width="1574" height="787" style="box-sizing: border-box; display: block; height: 393.6px; width: 787px;"></canvas>
  </div>
  <div class="stats-canvas">
    <canvas id="statsChartLocations" width="1574" height="787" style="box-sizing: border-box; display: block; height: 393.6px; width: 787px;"></canvas>
  </div>
</div>

<div id="stats-detail" class="mt-3"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// Generate visually distinct colors
function generateColors(n, s=65, l=55){
  function hslToRgb(h, s, l){
    s /= 100; l /= 100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
  }
  const out = [];
  for(let i=0;i<n;i++){
    const hue = Math.round((360 * i) / n);
    const [r,g,b] = hslToRgb(hue, s, l);
    out.push('#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1));
  }
  return out;
}

async function searchWorkers(query) {
  if(!query || query.length < 2) return {results: []};
  const resp = await fetch('{% url "buscar_trabajadores" %}?q='+encodeURIComponent(query));
  const json = await resp.json();
  console.log('searchWorkers', query, (json && json.results) ? json.results.length : 0);
  return json;
}

let _searchTimer = null;
function debounceSearch(q) {
  if(_searchTimer) clearTimeout(_searchTimer);
  _searchTimer = setTimeout(async ()=>{
    const data = await searchWorkers(q);
    console.log('debounceSearch results', data);
    const container = document.getElementById('worker-search-results');
    container.innerHTML = '';
    if(data && data.results && data.results.length){
      data.results.forEach(w=>{
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'list-group-item list-group-item-action';
        a.textContent = `${w.full_name} — ${w.cedula}`;
        a.dataset.id = w.id;
        a.dataset.cedula = w.cedula;
        a.addEventListener('click', function(e){
          e.preventDefault();
          console.log('worker selected', this.dataset.id, this.dataset.cedula);
          document.getElementById('cedula').value = this.dataset.cedula;
          document.getElementById('trabajador_id').value = this.dataset.id;
          container.style.display='none';
          renderChart();
        });
        container.appendChild(a);
      });
      container.style.display = '';
    } else {
      container.style.display = 'none';
    }
  }, 350);
}

async function fetchData(params) {
  const q = new URLSearchParams(params).toString();
  const resp = await fetch('{% url "estadisticas_data" %}?'+q);
  if(!resp.ok){
    const txt = await resp.text().catch(()=>'');
    console.error('estadisticas_data HTTP error', resp.status, txt);
    const container = document.getElementById('stats-detail');
    if(container) container.innerHTML = `<div class="alert alert-danger">Error cargando datos del servidor (status ${resp.status}).</div>`;
    return { error: true };
  }
  // leer cuerpo como texto y parsear JSON manualmente para poder mostrar el cuerpo en caso de fallo
  const bodyText = await resp.text();
  try{
    return JSON.parse(bodyText);
  }catch(e){
    console.error('estadisticas_data: respuesta no JSON o parse error', e, bodyText);
    const container = document.getElementById('stats-detail');
    if(container) container.innerHTML = '<div class="alert alert-danger">Respuesta inválida del servidor (no JSON).</div>';
    return { error: true };
  }
}

function renderDetailTable(detailRows) {
  if(!detailRows || detailRows.length===0) return '';
  let html = '<h5>Detalle de solicitudes</h5>';
  // Detectar si las filas contienen nombres/apellidos/cedula para mostrar columnas adicionales
  const first = detailRows[0] || {};
  const hasWorkerCols = ('nombres' in first) || ('apellidos' in first) || ('cedula' in first);
  if(hasWorkerCols){
    html += '<table class="table table-sm"><thead><tr><th>Fecha</th><th>Nombres</th><th>Apellidos</th><th>Cédula</th><th>Tipo</th><th>Estatus</th><th>Motivo</th></tr></thead><tbody>';
    detailRows.forEach(r=>{
      html += `<tr><td>${r.fecha}</td><td>${r.nombres || ''}</td><td>${r.apellidos || ''}</td><td>${r.cedula || ''}</td><td>${r.tipo || ''}</td><td>${r.estado || ''}</td><td>${r.motivo || ''}</td></tr>`;
    });
  } else {
    html += '<table class="table table-sm"><thead><tr><th>Fecha</th><th>Tipo</th><th>Estatus</th><th>Motivo</th></tr></thead><tbody>';
    detailRows.forEach(r=>{
      html += `<tr><td>${r.fecha}</td><td>${r.tipo || ''}</td><td>${r.estado || ''}</td><td>${r.motivo || ''}</td></tr>`;
    });
  }
  html += '</tbody></table>';
  return html;
}

async function renderChart() {
  const params = Object.fromEntries(new FormData(document.getElementById('stats-form')));
  // Si se proporcionó una cédula (q) pero no hay trabajador_id, intentar resolverlo vía la búsqueda
  if(params.q && !params.trabajador_id){
    try{
      const searchRes = await searchWorkers(params.q);
      if(searchRes && Array.isArray(searchRes.results) && searchRes.results.length){
        // Preferir coincidencia exacta por cédula
        let match = searchRes.results.find(r => String(r.cedula) === String(params.q));
        if(!match && searchRes.results.length === 1) match = searchRes.results[0];
        if(match){
          params.trabajador_id = match.id;
          const hid = document.getElementById('trabajador_id'); if(hid) hid.value = match.id;
        }
      }
    }catch(e){ console.warn('No se pudo resolver trabajador por cédula antes de fetchData', e); }
  }
  const data = await fetchData(params);
  if(!data || data.error){
    // ya mostramos mensaje en fetchData; ocultar canvases por seguridad
    try{ document.getElementById('statsChart').parentElement.style.display = 'none'; }catch(e){}
    try{ document.getElementById('statsChartLocations').parentElement.style.display = 'none'; }catch(e){}
    return;
  }
  const ctx = document.getElementById('statsChart').getContext('2d');
  const ctxLoc = document.getElementById('statsChartLocations').getContext('2d');
  if(window._statsChart) window._statsChart.destroy();
  if(window._statsChartLoc) window._statsChartLoc.destroy();
  const type = params.chart_type || 'pie';

  // Helper para formatear 'YYYY-MM-DD' a 'DD-MM-YYYY'
  function formatDateInputStr(d){ if(!d) return ''; try{ const parts = d.split('-'); if(parts.length===3) return `${parts[2]}-${parts[1]}-${parts[0]}`; return d;}catch(e){return d;} }

  // Construir título según filtros
  let titleParts = [];
  if (params.q) titleParts.push('Trabajador: ' + params.q);
  if (params.fecha_inicio || params.fecha_fin) titleParts.push((formatDateInputStr(params.fecha_inicio)||'') + ' - ' + (formatDateInputStr(params.fecha_fin)||''));
  if (params.ubicacion) titleParts.push('Ubicación: ' + params.ubicacion);
  const chartTitle = titleParts.length ? titleParts.join(' | ') : 'Estadísticas de solicitudes';

  if (data.datasets) {
    // filtered by trabajador: single chart (as before) and detail
    if (type === 'pie') {
      const statusLabels = data.datasets.map(ds=>ds.label);
      const statusValues = data.datasets.map(ds=>ds.data.reduce((a,b)=>a+b,0));
      // If there are no solicitudes for the trabajador, show message and do not attempt to export image
      const totalCount = statusValues.reduce((a,b)=>a+b,0);
      if(totalCount === 0){
        document.getElementById('stats-detail').innerHTML = '<div class="alert alert-info">El trabajador consultado no ha realizado ninguna solicitud.</div>';
        document.getElementById('statsChart').parentElement.style.display = 'none';
        document.getElementById('statsChartLocations').parentElement.style.display = 'none';
        updateExportBtn();
        return;
      }
      const statusColors = generateColors(statusLabels.length);
      window._statsChart = new Chart(ctx, {
        type: 'pie',
        data: { labels: statusLabels, datasets: [{ data: statusValues, backgroundColor: statusColors }] },
        options: {responsive:true, plugins: { title: { display: true, text: chartTitle, font: { size: 12 } }, legend: {position: 'bottom'} } }
      });
      document.getElementById('stats-detail').innerHTML = renderDetailTable(data.detail || []);
      // hide locations canvas for worker filter
      document.getElementById('statsChartLocations').parentElement.style.display = 'none';
    } else {
      const labels = data.labels;
      const datasets = data.datasets.map(ds=>({ label: ds.label, data: ds.data }));
      const dsColors = generateColors(datasets.length);
      datasets.forEach((d,i)=> d.backgroundColor = dsColors[i]);
      window._statsChart = new Chart(ctx, {
        type: 'bar',
        data: { labels: labels, datasets: datasets },
        options: {responsive:true, plugins: { title: { display: true, text: chartTitle, font: { size: 12 } }, legend: {position: 'bottom'}}, scales: { x: { stacked: true }, y: { stacked: true } }}
      });
      document.getElementById('stats-detail').innerHTML = renderDetailTable(data.detail || []);
      document.getElementById('statsChartLocations').parentElement.style.display = 'none';
    }

  } else {
    // No trabajador filter: render two charts
    const labels = data.labels;
    const values = data.values;
    // summary chart
    const summaryColors = generateColors(values.length);
    window._statsChart = new Chart(ctx, {
      type: type,
      data: {
        labels: labels,
        datasets: [{ label: 'Solicitudes', data: values, backgroundColor: summaryColors }]
      },
      options: {responsive:true, plugins: { title: { display: true, text: chartTitle, font: { size: 12 } }, legend: {position: 'bottom'}}}
    });
    // locations chart
    if (data.locations && data.locations.labels && data.locations.labels.length>0) {
      document.getElementById('statsChartLocations').parentElement.style.display = '';
      if (type === 'pie') {
        const locColors = generateColors(data.locations.labels.length);
        window._statsChartLoc = new Chart(ctxLoc, {
          type: 'pie',
          data: { labels: data.locations.labels, datasets: [{ data: data.locations.values, backgroundColor: locColors }] },
          options: {responsive:true, plugins: { title: { display: true, text: chartTitle + ' — Ubicaciones', font: { size: 12 } }, legend: {position: 'bottom'}}}
        });
      } else {
        const locColors = generateColors(data.locations.labels.length);
        window._statsChartLoc = new Chart(ctxLoc, {
          type: 'bar',
          data: { labels: data.locations.labels, datasets: [{ label: 'Solicitudes por ubicación', data: data.locations.values, backgroundColor: locColors }] },
          options: {responsive:true, plugins: { title: { display: true, text: chartTitle + ' — Ubicaciones', font: { size: 12 } }, legend: {position: 'bottom'}}, scales: { x: { ticks: {autoSkip: false} } }}
        });
      }
    } else {
      document.getElementById('statsChartLocations').parentElement.style.display = 'none';
    }
    document.getElementById('stats-detail').innerHTML = '';
  }

  // export handled by submitPdf() which sends canvas images to the server
  // (no href update needed)
}

// bind worker search input
const nombreInput = document.getElementById('nombre');
const workerResults = document.getElementById('worker-search-results');
if(nombreInput){
  nombreInput.addEventListener('input', (e)=> debounceSearch(e.target.value));
}
// hide results when clicking outside
document.addEventListener('click', function(e){
  if(!workerResults) return;
  if(e.target === nombreInput || workerResults.contains(e.target)) return;
  workerResults.style.display = 'none';
});

// si el usuario escribe manualmente la cédula, invalidar trabajador_id
const cedulaInput = document.getElementById('cedula');
if(cedulaInput){
  cedulaInput.addEventListener('input', ()=>{
    const hid = document.getElementById('trabajador_id');
    if(hid && hid.value) hid.value = '';
    updateExportBtn();
  });
}

document.getElementById('stats-form').addEventListener('submit', function(e){
  e.preventDefault(); renderChart();
});

// Helper: determine if any filters are applied
function hasFilters() {
  const params = Object.fromEntries(new FormData(document.getElementById('stats-form')));
  return Boolean(params.fecha_inicio || params.fecha_fin || params.q || params.trabajador_id || params.ubicacion);
}
function updateExportBtn(){
  const exportBtn = document.getElementById('export-pdf-btn');
  if(!exportBtn) return;
  const disabled = !hasFilters();
  exportBtn.disabled = disabled;
  if(disabled) { exportBtn.classList.add('disabled'); exportBtn.title = 'Aplicar filtros para habilitar exportar PDF'; }
  else { exportBtn.classList.remove('disabled'); exportBtn.title = ''; }
}
// Bind inputs to update export availability
document.querySelectorAll('#stats-form input, #stats-form select').forEach(el=>{
  el.addEventListener('input', updateExportBtn);
  el.addEventListener('change', updateExportBtn);
});

// bind export button
async function submitPdf(){
  try{
    const formEl = document.getElementById('stats-form');
    // Asegurar que el campo oculto `trabajador_id` sea un id numérico válido antes de enviar
    const hid = document.getElementById('trabajador_id');
    if(hid && hid.value && !/^\d+$/.test(hid.value)){
      hid.value = '';
    }
    const params = Object.fromEntries(new FormData(formEl));
    const canvasMain = document.getElementById('statsChart');
    const canvasLoc = document.getElementById('statsChartLocations');
    let img_chart = '';
    let img_locations = '';

  
    function getCanvasDataUrl(srcCanvas, chartObj){
      try{
        if(!srcCanvas) return '';
        // try direct capture
        try{
          const direct = srcCanvas.toDataURL('image/png');
          if(direct && direct.length > 500) return direct;
        }catch(e){ /* continue to drawing approach */ }
        // compute pixel sizes
        const dpr = window.devicePixelRatio || 1;
        const rect = srcCanvas.getBoundingClientRect();
        const w = (srcCanvas.width && srcCanvas.width>0) ? srcCanvas.width : Math.round(rect.width * dpr);
        const h = (srcCanvas.height && srcCanvas.height>0) ? srcCanvas.height : Math.round(rect.height * dpr);
        if(w <= 0 || h <= 0) return '';
        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        const tctx = tmp.getContext('2d');
        // draw image; if Chart.js has hidden title via options, capture after hiding
        tctx.drawImage(srcCanvas, 0, 0, w, h);
        const data = tmp.toDataURL('image/png');
        return data && data.length>200 ? data : '';
      }catch(e){ console.log('getCanvasDataUrl error', e); return ''; }
    }

    try{
      if(canvasMain){
        let origTitleDisplay;
        if(window._statsChart && window._statsChart.options && window._statsChart.options.plugins && window._statsChart.options.plugins.title){
          origTitleDisplay = window._statsChart.options.plugins.title.display;
          window._statsChart.options.plugins.title.display = false;
          window._statsChart.update();
        }
        img_chart = getCanvasDataUrl(canvasMain, window._statsChart);
        if(window._statsChart && typeof origTitleDisplay !== 'undefined'){
          window._statsChart.options.plugins.title.display = origTitleDisplay;
          window._statsChart.update();
        }
      }
    }catch(e){ console.log('submitPdf: cannot read main canvas',e); }

    try{
      if(canvasLoc && canvasLoc.parentElement.style.display !== 'none'){
        let origTitleDisplayLoc;
        if(window._statsChartLoc && window._statsChartLoc.options && window._statsChartLoc.options.plugins && window._statsChartLoc.options.plugins.title){
          origTitleDisplayLoc = window._statsChartLoc.options.plugins.title.display;
          window._statsChartLoc.options.plugins.title.display = false;
          window._statsChartLoc.update();
        }
        img_locations = getCanvasDataUrl(canvasLoc, window._statsChartLoc);
        if(window._statsChartLoc && typeof origTitleDisplayLoc !== 'undefined'){
          window._statsChartLoc.options.plugins.title.display = origTitleDisplayLoc;
          window._statsChartLoc.update();
        }
      }
    }catch(e){ console.log('submitPdf: cannot read loc canvas',e); }

    const fd = new FormData();
    for(const [k,v] of Object.entries(params)) fd.append(k, v);
    fd.append('img_chart', img_chart);
    fd.append('img_locations', img_locations);

    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    const resp = await fetch('{% url "exportar_estadisticas_pdf" %}', { method: 'POST', headers: { 'X-CSRFToken': csrftoken }, body: fd });
    if(!resp.ok){ const txt = await resp.text(); console.error('PDF download failed', resp.status, txt); alert('Error generando PDF'); return; }
    const blob = await resp.blob();
    const contentDisp = resp.headers.get('Content-Disposition') || '';
    let filename = 'estadisticas.pdf';
    const m = contentDisp.match(/filename=?([^\"]+)?/);
    if(m && m[1]) filename = m[1];
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 10000);
  }catch(e){ console.error('submitPdf error', e); alert('Error al generar PDF'); }
}

const exportBtn = document.getElementById('export-pdf-btn');
if(exportBtn) exportBtn.addEventListener('click', ()=>{ submitPdf(); });

// Initial render
renderChart();
updateExportBtn();
</script>
{% endblock %}
