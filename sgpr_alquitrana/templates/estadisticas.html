{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="fw-bold mb-1">Estadísticas de Solicitudes</h3>
    <p class="text-muted mb-0">Generar gráficos y reportes por rango de fechas y por trabajador.</p>
  </div>
  <div class="d-flex gap-2">
    {% with qs=request.GET.urlencode %}
      <a id="export-xlsx" class="btn btn-outline-secondary" href="{% url 'exportar_estadisticas_excel' %}{% if qs %}?{{ qs }}{% endif %}">Descargar XLSX</a>
      <a id="export-pdf" class="btn btn-outline-secondary" href="{% url 'exportar_estadisticas_pdf' %}{% if qs %}?{{ qs }}{% endif %}">Descargar PDF</a>
    {% endwith %}
  </div>
</div>

<form id="stats-form" method="get" class="mb-4 row gx-2 gy-2 align-items-center">
  <div class="col-md-3">
    <label class="visually-hidden" for="fecha_inicio">Fecha inicio</label>
    <input type="date" id="fecha_inicio" name="fecha_inicio" class="form-control" value="{{ request.GET.fecha_inicio|default:'' }}">
  </div>
  <div class="col-md-3">
    <label class="visually-hidden" for="fecha_fin">Fecha fin</label>
    <input type="date" id="fecha_fin" name="fecha_fin" class="form-control" value="{{ request.GET.fecha_fin|default:'' }}">
  </div>
  <div class="col-md-3">
    <label class="visually-hidden" for="cedula">Cédula</label>
    <input type="text" id="cedula" name="q" placeholder="Cédula (opcional)" class="form-control" value="{{ request.GET.q|default:'' }}">
  </div>
  <div class="col-md-2">
    <select id="chart_type" name="chart_type" class="form-select">
      <option value="pie">Circular</option>
      <option value="bar">Barras</option>
    </select>
  </div>
  <div class="col-md-1 d-grid">
    <button type="submit" class="btn btn-secondary">Aplicar</button>
  </div>
</form>

<div class="mb-4">
  <canvas id="statsChart" width="800" height="400"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
async function fetchData(params) {
  const q = new URLSearchParams(params).toString();
  const resp = await fetch('{% url "estadisticas_data" %}?'+q);
  return resp.json();
}

async function renderChart() {
  const params = Object.fromEntries(new FormData(document.getElementById('stats-form')));
  const data = await fetchData(params);
  const ctx = document.getElementById('statsChart').getContext('2d');
  if(window._statsChart) window._statsChart.destroy();
  const labels = data.labels;
  const values = data.values;
  const type = params.chart_type || 'pie';
  window._statsChart = new Chart(ctx, {
    type: type,
    data: {
      labels: labels,
      datasets: [{
        label: 'Solicitudes',
        data: values,
        backgroundColor: ['#4e73df','#1cc88a','#e74a3b','#f6c23e']
      }]
    },
    options: {responsive:true}
  });
  // Update export links
  const qs = new URLSearchParams(params).toString();
  document.getElementById('export-xlsx').href = '{% url "exportar_estadisticas_excel" %}' + (qs?('?'+qs):'');
  document.getElementById('export-pdf').href = '{% url "exportar_estadisticas_pdf" %}' + (qs?('?'+qs):'');
}

document.getElementById('stats-form').addEventListener('submit', function(e){
  e.preventDefault(); renderChart();
});
// Initial render
renderChart();
</script>
{% endblock %}
