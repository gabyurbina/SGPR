{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="fw-bold mb-1">Estadísticas de Solicitudes</h3>
    <p class="text-muted mb-0">Generar gráficos y reportes por rango de fechas y por trabajador.</p>
  </div>
  <div class="d-flex gap-2">
    {% with qs=request.GET.urlencode %}
      <a id="export-xlsx" class="btn btn-outline-secondary" href="{% url 'exportar_estadisticas_excel' %}{% if qs %}?{{ qs }}{% endif %}">Descargar XLSX</a>
      <a id="export-pdf" class="btn btn-outline-secondary" href="{% url 'exportar_estadisticas_pdf' %}{% if qs %}?{{ qs }}{% endif %}">Descargar PDF</a>
    {% endwith %}
  </div>
</div>

<form id="stats-form" method="get" class="mb-4 row gx-2 gy-2 align-items-end">
  <div class="col-md-2">
    <label class="visually-hidden" for="fecha_inicio">Fecha inicio</label>
    <input type="date" id="fecha_inicio" name="fecha_inicio" class="form-control" value="{{ request.GET.fecha_inicio|default:'' }}">
  </div>
  <div class="col-md-2">
    <label class="visually-hidden" for="fecha_fin">Fecha fin</label>
    <input type="date" id="fecha_fin" name="fecha_fin" class="form-control" value="{{ request.GET.fecha_fin|default:'' }}">
  </div>
  <div class="col-md-3">
    <label class="visually-hidden" for="cedula">Cédula</label>
    <input type="text" id="cedula" name="q" placeholder="Cédula (opcional)" class="form-control" value="{{ request.GET.q|default:'' }}">
  </div>
  <div class="col-md-3">
    <label class="visually-hidden" for="ubicacion">Ubicación Administrativa</label>
    <input type="text" id="ubicacion" name="ubicacion" placeholder="Ubicación administrativa (opcional)" class="form-control" value="{{ request.GET.ubicacion|default:'' }}">
  </div>
  <div class="col-md-1">
    <select id="chart_type" name="chart_type" class="form-select">
      <option value="pie" {% if request.GET.chart_type == 'pie' %}selected{% endif %}>Circular</option>
      <option value="bar" {% if request.GET.chart_type == 'bar' %}selected{% endif %}>Barras</option>
    </select>
  </div>
  <div class="col-md-1 d-grid">
    <button type="submit" class="btn btn-secondary">Aplicar</button>
  </div>
</form>

<div class="mb-4 text-center">
  <canvas id="statsChart" width="480" height="240" style="display:inline-block; max-width:480px; max-height:240px;"></canvas>
</div>

<div id="stats-detail" class="mt-3"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
async function fetchData(params) {
  const q = new URLSearchParams(params).toString();
  const resp = await fetch('{% url "estadisticas_data" %}?'+q);
  return resp.json();
}

function renderDetailTable(detailRows) {
  if(!detailRows || detailRows.length===0) return '';
  let html = '<h5>Detalle de solicitudes</h5>';
  html += '<table class="table table-sm"><thead><tr><th>Fecha</th><th>Estatus</th><th>Número</th></tr></thead><tbody>';
  detailRows.forEach(r=>{
    html += `<tr><td>${r.fecha}</td><td>${r.estado}</td><td>${r.numero}</td></tr>`;
  });
  html += '</tbody></table>';
  return html;
}

async function renderChart() {
  const params = Object.fromEntries(new FormData(document.getElementById('stats-form')));
  const data = await fetchData(params);
  const ctx = document.getElementById('statsChart').getContext('2d');
  if(window._statsChart) window._statsChart.destroy();
  const type = params.chart_type || 'pie';

  if (data.datasets) {
    // When filtered by trabajador: if chart_type is 'pie' show aggregated pie of statuses; else show stacked bar per date
    if (type === 'pie') {
      const statusLabels = data.datasets.map(ds=>ds.label);
      const statusValues = data.datasets.map(ds=>ds.data.reduce((a,b)=>a+b,0));
      window._statsChart = new Chart(ctx, {
        type: 'pie',
        data: { labels: statusLabels, datasets: [{ data: statusValues, backgroundColor: data.datasets.map(ds=>ds.color||'#4e73df') }] },
        options: {responsive:true, plugins: {legend: {position: 'bottom'}}}
      });
      document.getElementById('stats-detail').innerHTML = renderDetailTable(data.detail || []);
    } else {
      const labels = data.labels;
      const datasets = data.datasets.map(ds=>({ label: ds.label, data: ds.data, backgroundColor: ds.color || '#4e73df' }));
      window._statsChart = new Chart(ctx, {
        type: 'bar',
        data: { labels: labels, datasets: datasets },
        options: {responsive:true, plugins: {legend: {position: 'bottom'}}, scales: { x: { stacked: true }, y: { stacked: true } }}
      });
      document.getElementById('stats-detail').innerHTML = renderDetailTable(data.detail || []);
    }

  } else {
    const labels = data.labels;
    const values = data.values;
    window._statsChart = new Chart(ctx, {
      type: type,
      data: {
        labels: labels,
        datasets: [{ label: 'Solicitudes', data: values, backgroundColor: ['#4e73df','#1cc88a','#e74a3b','#f6c23e'] }]
      },
      options: {responsive:true, plugins: {legend: {position: 'bottom'}}}
    });
    document.getElementById('stats-detail').innerHTML = '';
  }

  // Update export links
  const qs = new URLSearchParams(params).toString();
  document.getElementById('export-xlsx').href = '{% url "exportar_estadisticas_excel" %}' + (qs?('?'+qs):'');
  document.getElementById('export-pdf').href = '{% url "exportar_estadisticas_pdf" %}' + (qs?('?'+qs):'');
}

document.getElementById('stats-form').addEventListener('submit', function(e){
  e.preventDefault(); renderChart();
});
// Initial render
renderChart();
</script>
{% endblock %}
