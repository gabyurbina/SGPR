{% extends 'base.html' %}
{% block content %}
<!-- Página de inicio de sesión. Usa el formulario de autenticación con cédula. -->
<div class="container px-4">
  <div class="form-shell mx-auto">
    <div class="form-card">
      <div class="form-card-header">
        <h3>Inicio de sesión</h3>
        <p>Accede a tu panel administrativo o envía tus solicitudes de permiso.</p>
      </div>
      <form method="post" class="form-body">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}
          <input type="hidden" name="next" value="{{ next }}" />
        {% endif %}
        <button class="btn btn-primary-custom" type="submit">Ingresar</button>
      </form>
      <div class="form-footer text-center">
        <p>¿No tienes usuario? <a href="{% url 'registro_trabajador' %}">Regístrate aquí</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
