{% extends 'base.html' %}
{% block content %}
<!-- Página para cambiar contraseña obligatoria o voluntaria. -->
<div class="row justify-content-center">
  <div class="col-lg-7 col-md-8">
    <div class="auth-card">
      <div class="page-header">
        <h3>Cambiar contraseña</h3>
        <p>Para continuar, ingresa tu contraseña actual y luego la nueva contraseña.</p>
        <p class="text-muted small mb-3">Usa la contraseña con la que iniciaste sesión en este momento.</p>
      </div>
      <form method="post" class="form-body">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-primary-custom" type="submit">Actualizar contraseña</button>
        <a class="btn btn-secondary-custom" href="{% url 'configuracion' %}">Volver</a>
      </div>
    </form>
    </div>
  </div>
</div>
{% endblock %}
