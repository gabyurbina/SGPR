server {
    listen 80;
    server_name example.com;

    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        alias /srv/sgpr/static/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/sgpr.sock;
    }

    client_max_body_size 20M;
}
